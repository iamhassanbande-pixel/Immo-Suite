[package]
name = "immo-domain"
version = "0.0.0"
description = "Règles pures d'Immo Suite : aucune entrée-sortie, aucune horloge, aucune base (CODING_RULES.md §1.1)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# dates civiles seulement (étape 06) : sans la fonction « clock », le domaine ne peut pas lire l'heure (R-002, DP-50)
chrono = { version = "0.4", default-features = false }

[dev-dependencies]
proptest = "1"
